[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wolfworks-mcp-auth"
version = "0.1.0"
description = "WorkOS token verification and an identity gate for MCP servers built on the official mcp SDK."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Wolf Works" }]
dependencies = [
    "mcp>=2.2.0",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fastapi>=0.110",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wolfworks_mcp_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
