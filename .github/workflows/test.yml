name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Three consumers deploy without a lock file, so they install the newest PyJWT,
    # httpx and mcp 2.2.x there is: hear that one broke this on a Monday rather than
    # during a deploy. It cannot see mcp 2.3; pyproject's ceiling excludes it.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  wheel-installs-without-git:
    # Consumers' images are python:slim and have no git, and what they pin is the
    # wheel: build it as the release does and install it there, before a tag exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.12-slim sh -c \
            '! command -v git && pip install --quiet /dist/*.whl && python -c "import wolfworks_mcp_auth, mcp; print(wolfworks_mcp_auth.__all__)"'
